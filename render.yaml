services:
  # -------------------------------------------------------------
  # 1. AI NLP Microservice (Python FastAPI / Docker)
  # -------------------------------------------------------------
  - type: web
    name: metamind-ai-service
    runtime: docker
    dockerfilePath: ai-service/Dockerfile
    dockerContext: ai-service
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOW_MEMORY_MODE
        value: "true"
      - key: HF_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. Backend API Gateway (Node.js / Express)
  # -------------------------------------------------------------
  - type: web
    name: metamind-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: metamind-ai-service
          property: hostport
      - key: CLIENT_URL
        sync: false

  # -------------------------------------------------------------
  # 3. Frontend Client (React 18 + Vite Static Site)
  # -------------------------------------------------------------
  - type: web
    name: metamind-client
    runtime: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

